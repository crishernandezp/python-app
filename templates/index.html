<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #721e1e, #721e1e);
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        .converter-card {
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(159, 159, 159, 0.95);
        }

        .result-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2ca217;
        }

        @media (max-width: 576px) {
            .converter-card {
                padding: 15px !important;
            }
        }

        /* Barra de navegación */
        .navbar-custom {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #152d52;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }

        .navbar-logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .navbar-links {
            display: flex;
            gap: 25px;
        }

        .navbar-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        .navbar-links a:hover {
            color: #00d4ff;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

    <!-- Barra de navegación -->
    <nav class="navbar-custom">
        <a href="/" class="navbar-logo">💱 DivisaApp</a>

        <div class="navbar-links">
            <a href="/">Inicio</a>
            <a href="#conversor">Conversor</a>
        </div>
    </nav>

    <!-- Conversor de divisas original -->
    <div id="conversor" class="card shadow-lg p-4 converter-card" style="width: 90%; max-width: 400px;">

        <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Cantidad</label>
                <input type="number" step="0.01" name="amount" class="form-control form-control-lg"
                    placeholder="Introduce cantidad" required>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <select name="from_currency" class="form-select">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>

                <div class="col text-center align-self-center">
                    →
                </div>

                <div class="col">
                    <select name="to_currency" class="form-select">
                        <option value="USD">USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Convertir
                </button>
            </div>
        </form>

        {% if result is not none %}
        <div class="mt-4 text-center result-box">
            {{ result }}
        </div>
        {% endif %}

    </div>

</body>

</html>
